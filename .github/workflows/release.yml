name: Release

# Pushes to main (or a v* tag, or a manual run) build a signed release APK and
# publish it straight to GitHub Releases, so the app can be installed from the
# Releases page without any local build.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Check drawables are VectorDrawables
        run: python3 tools/check_icons.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read app version
        id: version
        run: |
          name=$(grep -E '^voidVersionName *=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          code=$(grep -E '^voidVersionCode *=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/VOID-${{ steps.version.outputs.name }}.apk"
          ls -lh dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: VOID-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VOID ${{ steps.version.outputs.name }}
          body: |
            VOID ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})

            Install: download `VOID-${{ steps.version.outputs.name }}.apk` below and open it on your device
            (allow "install unknown apps" for your browser/file manager).

            Built from `${{ github.sha }}` on ${{ github.ref_name }}.
          files: dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true
