[versions]
# ---- App version (single source of truth; CI reads these keys) ----
voidVersionCode = "5"
voidVersionName = "0.1.4"

# ---- Toolchain ----
agp = "9.5.1"
kotlin = "2.3.21"

# ---- Android SDK ----
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"

# ---- AndroidX / Compose ----
composeBom = "2026.09.00"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"


[libraries]
# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

# Icons: Lucide paths are inlined in ui/components/Lucide.kt.
# io.github.thelacspace:lucide-compose:1.16.0 on Maven Central only ships the
# generator's test icons, so it cannot be used as a dependency yet.

# Build logic only (compileOnly for convention plugins)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Never applied: this only puts KGP on the root build classpath so AGP 9's
# built-in Kotlin compiler uses the project's Kotlin version.
kotlin-gradlePlugin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

# Plugins are defined inside build-logic
voidapp-android-application = { id = "voidapp.android.application" }
voidapp-android-compose = { id = "voidapp.android.compose" }
